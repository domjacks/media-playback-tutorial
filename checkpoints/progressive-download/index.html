<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Progressive Download Playback</title>
  </head>
  <body>
    <!-- #region index -->
    <video
      id="video"
      controls
      preload="metadata"
      width="800"
      src="https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4">
    </video>

    <script type="module" src="./player.js"></script>
    <!-- #endregion index -->
  </body>
</html>
